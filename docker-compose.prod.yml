# Production overlay.  Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from development: production build targets, no bind mounts, no
# --reload, no published database or application ports (Caddy is the only way
# in), and Caddy provisions TLS for SITE_ADDRESS.
#
# Migrations remain an explicit deploy step (ARCHITECTURE.md §11):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     exec api alembic upgrade head

services:
  postgres:
    ports: !override []
    restart: always

  api:
    build:
      context: ./api
      target: prod
    environment:
      APP_ENV: production
      PUBLIC_WEB_ORIGIN: https://${WEB_DOMAIN}
    ports: !override []
    volumes: !override []
    restart: always

  web:
    build:
      context: ./web
      target: prod
      args:
        NEXT_PUBLIC_SITE_URL: https://${WEB_DOMAIN}
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    environment:
      NODE_ENV: production
    ports: !override []
    volumes: !override []
    restart: always

  caddy:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Both must share one registrable domain — see Caddyfile.prod.
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
    volumes: !override
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always
