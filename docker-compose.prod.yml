# Production overlay.  Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from development: production build targets, no bind mounts, no
# --reload, no published database or application ports (Caddy is the only way
# in), and Caddy provisions TLS for SITE_ADDRESS.
#
# The two images are named apart on purpose.  Without that, both files build
# `results-portal-api` and `results-portal-web`, so verifying a production
# build replaces the development image with one that has no source mount and
# no --reload — and the next `docker compose up` starts it, which fails with
# "Cannot find module /app/server.js" and no indication why
# (docs/DECISIONS.md D52).
#
# Migrations remain an explicit deploy step (ARCHITECTURE.md §11):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     exec api alembic upgrade head

services:
  postgres:
    ports: !override []
    restart: always

  api:
    image: results-portal-api-prod
    build:
      context: ./api
      target: prod
    environment:
      APP_ENV: production
      PUBLIC_WEB_ORIGIN: https://${WEB_DOMAIN}
      # No default: the API refuses to start in production without a real one.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
    ports: !override []
    volumes: !override []
    restart: always

  web:
    image: results-portal-web-prod
    build:
      context: ./web
      target: prod
      args:
        NEXT_PUBLIC_SITE_URL: https://${WEB_DOMAIN}
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    environment:
      NODE_ENV: production
    ports: !override []
    volumes: !override []
    restart: always

  caddy:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Both must share one registrable domain — see Caddyfile.prod.
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
    volumes: !override
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always
