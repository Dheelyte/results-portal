# Alembic configuration.
#
# sqlalchemy.url is deliberately absent: the URL is injected in alembic/env.py
# from app.config.settings, so no credential is ever committed
# (ARCHITECTURE.md §11, docs/DECISIONS.md D7).

[alembic]
script_location = alembic
path_separator = os
prepend_sys_path = src

# Readable filenames: 0002_add_core_schema.py rather than a random hex.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migration files are UTC, matching every timestamp in the system.
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
