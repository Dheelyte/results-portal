[project]
name = "results-portal-api"
version = "0.1.0"
description = "Results portal for Self-Starters House Montessori School"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # Auth (§5.1). Approved in docs/DECISIONS.md D16.
    "argon2-cffi>=23.1,<26.0",
    "pyjwt>=2.10,<3.0",
    # The report card PDF (§9). Both are named in §2's stack table and in
    # CLAUDE.md, so they are the approved choice rather than an addition.
    "weasyprint>=63,<67",
    "jinja2>=3.1,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    # §9's golden-file test compares the PDF's **extracted text** against a
    # committed expected output, and WeasyPrint writes PDFs without being able
    # to read one back. Test-only, pure Python, and used by nothing the
    # application ships (docs/DECISIONS.md D79).
    "pypdf>=5.1,<7.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session. The application's engine is built at
# import time and pools connections; a loop per test would hand a later test a
# connection bound to a loop that has already closed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Alembic cannot read a GENERATED ALWAYS expression back out of the
    # database to compare it, and says so once per autogenerate run. Expected:
    # a change to result_entries.ca_test_total (R2) needs a hand-written
    # migration, which alembic/env.py documents.
    "ignore:Computed default on .* cannot be modified:UserWarning",
]
