# Development stack: caddy -> web, api;  api -> postgres  (ARCHITECTURE.md §11)
#
# Migrations are never run at container start.  Apply them explicitly:
#   docker compose exec api alembic upgrade head

name: results-portal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
    ports:
      # Loopback only — never expose the database beyond this host.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # §11's dumps, read-only here. pg_dump runs in the api container and
      # pg_restore in this one, so the volume has to be visible to both or
      # every restore starts with a file copy (docs/RUNBOOK.md §3).
      - backup_store:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: dev
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://portal:portal@postgres:5432/portal}
      REPORT_STORE: ${REPORT_STORE:-/var/lib/portal/reports}
      BACKUP_STORE: ${BACKUP_STORE:-/var/lib/portal/backups}
      # §11 takes a dump before every publish and refuses to publish without
      # one. False only to get results out past a broken backup store.
      REQUIRE_PREPUBLISH_BACKUP: ${REQUIRE_PREPUBLISH_BACKUP:-true}
      # The one origin allowed to call this API from a browser. Never "*" —
      # the refresh cookie is sent with credentials (milestone 2).
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-secret-change-me-before-production}
      # §5.1's per-IP limit (A34). Pass-through so the E2E stack can raise it:
      # the journey signs in at every step from one address, and the staff
      # screens cannot cache a token — it lives in memory (D41).
      LOGIN_IP_MAX_ATTEMPTS: ${LOGIN_IP_MAX_ATTEMPTS:-20}
      LOGIN_IP_WINDOW_MINUTES: ${LOGIN_IP_WINDOW_MINUTES:-15}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind-mount the source for --reload.  The virtualenv lives at /opt/venv,
      # outside the mount, so it survives.
      - ./api/src:/app/src
      - ./api/tests:/app/tests
      - ./api/alembic:/app/alembic
      - ./api/alembic.ini:/app/alembic.ini:ro
      # Tool configuration — ruff and pytest both read it, so an edit must not
      # need an image rebuild to take effect.
      - ./api/pyproject.toml:/app/pyproject.toml:ro
      - ./api/scripts:/app/scripts:ro
      # Generated report cards (§9, §2.1: "generate on demand, cache the
      # artifact"). A named volume, so a container rebuild does not throw
      # away every card a parent might be about to open.
      - report_store:/var/lib/portal/reports
      # §11's database dumps: nightly, and one before every publish. A named
      # volume so a container rebuild does not throw away the only copy.
      - backup_store:/var/lib/portal/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; urllib is already there.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
      # Browser-side calls go to the API's own hostname; server components
      # take the short path over the Docker network instead.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.localhost:8080}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./web:/app
      # The committed OpenAPI schema, so `npm run generate:api` works inside
      # the container without mounting the whole api/ tree.
      - ./api/openapi.json:/app/openapi.json:ro
      # Keep the image's node_modules — the host has none, and bind-mounting
      # over them would empty the directory.
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  # E2E, behind a profile so the normal `docker compose up -d` never starts it
  # (ARCHITECTURE.md §10, docs/DECISIONS.md D98).
  #
  #   docker compose --profile e2e run --rm e2e
  #
  # Microsoft's own image, because Playwright does not support musl and the
  # web service is node:22-alpine. The tag's version must equal the
  # `@playwright/test` version in web/package.json: the client and the
  # bundled browsers are released together.
  #
  # `network_mode: host` so the two hostnames inside the container are the
  # two hostnames outside it. The journey crosses between `localhost:8080`
  # and `api.localhost:8080`, and testing that over the Docker network would
  # test a topology the school does not have.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    network_mode: host
    extra_hosts:
      - "api.localhost:127.0.0.1"
    working_dir: /work
    environment:
      E2E_BASE_URL: ${E2E_BASE_URL:-http://localhost:8080}
      E2E_API_URL: ${E2E_API_URL:-http://api.localhost:8080}
      CI: ${CI:-}
      # The image already carries the browsers for this exact version, so the
      # install step must not fetch them again — that is the whole reason for
      # pinning the tag to the package.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    volumes:
      - ./web:/work
      # Its own, because the web service's are musl-linked and this image is
      # glibc. Installed on first run and kept.
      - e2e_node_modules:/work/node_modules
    # `npm ci` deletes node_modules and reinstalls from scratch, which on this
    # tree is minutes — and the volume below keeps them between runs, so it is
    # minutes spent undoing itself. Install only when the install is missing.
    command:
      - sh
      - -c
      - >-
        if [ ! -d node_modules/@playwright/test ]; then
          npm ci --no-audit --no-fund;
        fi;
        exec npx playwright test

  caddy:
    image: caddy:2-alpine
    ports:
      # Same port inside and out, so the Host header's port matches the site
      # address in the Caddyfile exactly.
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      # Probes the API hostname, which is the block most likely to be
      # misconfigured after a routing change.
      test:
        - CMD
        - wget
        - --spider
        - -q
        - "--header=Host: api.localhost:8080"
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  report_store:
  backup_store:
  web_node_modules:
  web_next_cache:
  e2e_node_modules:
  caddy_data:
  caddy_config:
